plugins {
    id "com.android.application"
}

def sherlockKeystore = file("/workspace/tooling/lughnasadh-debug.keystore")
def sherlockStorePass = "android"
def sherlockKeyAlias = "lughnasadh"
def sherlockKeyPass = "android"

android {
    namespace "com.lughlabs.sherlock"
    compileSdk 34

    defaultConfig {
        applicationId "com.lughlabs.sherlock"
        minSdk 28
        targetSdk 34
        versionCode 1
        versionName "0.1.0"
        ndk {
            abiFilters "arm64-v8a"
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }

    signingConfigs {
        release {
            if (sherlockKeystore.exists()) {
                storeFile sherlockKeystore
                storePassword sherlockStorePass
                keyAlias sherlockKeyAlias
                keyPassword sherlockKeyPass
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            if (sherlockKeystore.exists()) {
                signingConfig signingConfigs.release
            }
        }
        release {
            minifyEnabled false
            if (sherlockKeystore.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "androidx.webkit:webkit:1.11.0"
    implementation "androidx.activity:activity:1.9.2"
}


configurations.all {
    resolutionStrategy {
        force "org.jetbrains.kotlin:kotlin-stdlib:1.9.24"
        force "org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.9.24"
        force "org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.24"
    }
}
